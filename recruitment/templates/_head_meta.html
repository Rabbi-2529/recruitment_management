{% load static %}{% with site=request.scheme|add:"://"|add:request.get_host %}
  <meta name="description" content="{{ meta_description|default:'Check your IGL interview result with your phone number and department.' }}">
  <meta name="theme-color" content="#0f172a">
  {% if noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Messenger) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IGL Careers">
  <meta property="og:title" content="{{ meta_title|default:'IGL Careers - Interview Result' }}">
  <meta property="og:description" content="{{ meta_description|default:'Check your IGL interview result with your phone number and department.' }}">
  <meta property="og:url" content="{{ site }}{{ request.path }}">
  <meta property="og:image" content="{{ site }}{% static 'img/og-image.png' %}">
  <meta property="og:image:secure_url" content="{{ site }}{% static 'img/og-image.png' %}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="IGL Careers logo - Interview Result">
  <meta property="og:logo" content="{{ site }}{% static 'img/logo.png' %}">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ meta_title|default:'IGL Careers - Interview Result' }}">
  <meta name="twitter:description" content="{{ meta_description|default:'Check your IGL interview result with your phone number and department.' }}">
  <meta name="twitter:image" content="{{ site }}{% static 'img/og-image.png' %}">
  <meta name="twitter:image:alt" content="IGL Careers logo - Interview Result">

  <!-- Logo for search engines -->
  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "Organization", "name": "IGL", "url": "{{ site }}/", "logo": "{{ site }}{% static 'img/logo.png' %}", "email": "{{ HR_EMAIL }}", "telephone": "{{ HR_PHONE }}"}
  </script>
{% endwith %}
